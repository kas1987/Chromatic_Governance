# Self-contained test fixture config.
# Mirrors the shape of production config/repos.yaml but uses the placeholder
# repo `example-org/example-repo` that the broker test suite exercises. This
# keeps the tests independent of production config drift.
repos:
  example-org/example-repo:
    status: active
    default_branch: main
    installation_id: REPLACE_WITH_INSTALLATION_ID
    allowed_agents:
      - repo_scout
      - auditor
      - code_sentinel
    protected_branches:
      - main
      - release/*
    high_risk_paths:
      - .github/workflows/**
      - security/**
      - config/**
      - Dockerfile
      - docker-compose*.yml
      - requirements*.txt
      - pyproject.toml
      - package-lock.json
      - .env*
      - '*.pem'
      - '*.key'
    blocked_paths:
      - .git/**
      - secrets/**
      - private_keys/**
    required_pr_labels:
      - agent-change
