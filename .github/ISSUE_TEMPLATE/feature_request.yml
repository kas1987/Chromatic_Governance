name: Feature request
description: Propose a change to governance workflows, automation, or documentation.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Share the desired outcome and why it matters.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What limitation are you facing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected behavior and scope.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List any alternatives and tradeoffs.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: This request aligns with repository governance goals
          required: true
        - label: I reviewed existing issues and PRs first
          required: true
