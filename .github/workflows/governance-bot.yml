name: Chromatic Governance Bot

on:
  # Sync governance docs on push to Main
  push:
    branches: ["Main"]
    paths:
      - "**.md"
      - "**.csv"
  # Daily drift check
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  governance-sync:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        continue-on-error: true
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}  # pragma: allowlist secret

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}  # pragma: allowlist secret

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests pyyaml

      - name: Run governance checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARNESS_REPO: kas1987/Chromatic_Governance
        run: python .github/scripts/governance_check.py
