name: Chromatic Review Intake

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited]
  check_run:
    types: [completed]
  workflow_run:
    types: [completed]

permissions:
  contents: write
  pull-requests: read
  issues: write
  checks: read

defaults:
  run:
    shell: bash

jobs:
  ingest-review:
    if: ${{ !github.event.repository.private && (github.event_name != 'issue_comment' || github.event.issue.pull_request != null) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure intake folders exist
        run: |
          mkdir -p .agents/review-intake/logs .agents/review-intake/locks
          touch .agents/review-intake/review-findings.jsonl
          test -f .agents/review-intake/next-work.queue.json \
            || echo '{"items":[]}' > .agents/review-intake/next-work.queue.json

      - name: Ingest GitHub review event
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          PYTHONPATH: ".03_Harness Governance/scripts"
        run: |
          python ".03_Harness Governance/scripts/review_intake.py" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --findings ".agents/review-intake/review-findings.jsonl" \
            --queue ".agents/review-intake/next-work.queue.json" \
            --state ".agents/review-intake/review-intake.state.json"

      - name: Commit intake updates
        run: |
          git config user.name "Chromatic Review Intake"
          git config user.email "actions@github.com"
          git add \
            .agents/review-intake/review-findings.jsonl \
            .agents/review-intake/next-work.queue.json \
            .agents/review-intake/review-intake.state.json
          git diff --cached --quiet \
            || git commit -m "chore(review-intake): ingest GitHub review event [${{ github.event_name }}]"
          git push
