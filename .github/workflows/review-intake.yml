name: Chromatic Review Intake

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited]
  check_run:
    types: [completed]
  workflow_run:
    types: [completed]

permissions:
  contents: write
  pull-requests: read
  issues: write
  checks: read

# Serialize so concurrent events don't race on the auto-commit/push. Do NOT
# cancel in progress: an interrupted push could drop an ingested finding.
concurrency:
  group: review-intake-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ingest-review:
    # Gate the auto-commit path: human-triggered events (reviews/comments) only
    # ingest when the author is a trusted collaborator — a hostile comment must
    # not be able to drive commits into the repo. Repo-internal events
    # (check_run/workflow_run) have no author and are allowed.
    if: >-
      ${{ !github.event.repository.private
          && (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
          && (
               github.event_name == 'check_run'
               || github.event_name == 'workflow_run'
               || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
               || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
             )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Ensure intake folders exist
        run: |
          mkdir -p .agents/review-intake/logs .agents/review-intake/locks
          touch .agents/review-intake/review-findings.jsonl
          test -f .agents/review-intake/next-work.queue.json \
            || echo '{"items":[]}' > .agents/review-intake/next-work.queue.json

      - name: Ingest GitHub review event
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          PYTHONPATH: ".03_Harness Governance/scripts"
        run: |
          python ".03_Harness Governance/scripts/review_intake.py" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --findings ".agents/review-intake/review-findings.jsonl" \
            --queue ".agents/review-intake/next-work.queue.json" \
            --state ".agents/review-intake/review-intake.state.json"

      - name: Commit intake updates
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git config user.name "Chromatic Review Intake"
          git config user.email "actions@github.com"
          git add \
            .agents/review-intake/review-findings.jsonl \
            .agents/review-intake/next-work.queue.json \
            .agents/review-intake/review-intake.state.json
          git diff --cached --quiet \
            || git commit -m "chore(review-intake): ingest GitHub review event [${EVENT_NAME}]"
          git push
