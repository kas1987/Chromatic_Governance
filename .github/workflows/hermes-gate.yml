name: Hermes Gate

# PDR-008 / HERMES-006 — single CI gate for local-agent (Hermes) work.
# Merges two source plans into one workflow keyed on the eval_receipt contract:
#   - chromatic_mission_packet_framework_v1/validation/CI_GATE_PLAN.md (phased: advisory -> required)
#   - hermes_harness_pipeline_scaffold_v1/07_CI/CI_GATE_PLAN.md (schema-validate / yaml-parse / unit-tests)
#
# Scope is deliberately limited to '.03_Harness Governance/**' so this gate does NOT
# overlap with skill-governance.yml (scoped to '.02_Plugins/**'). Distinct job names
# and concurrency group — no collision with any existing workflow.
#
# Phase note: schema-validate validates every eval receipt that is present and rejects
# invalid ones (Phase 1/2). The receipt-required job below is framework **Phase 3**: a
# pull request that changes mission files under '.03_Harness Governance/' must also add
# or update an eval receipt. Non-mission infra changes can waive it with a 'no-receipt'
# PR label. Enforcement is PR-only (a post-merge push has no PR diff to evaluate).

on:
  pull_request:
    paths:
      - '.03_Harness Governance/**'
  push:
    branches: [Main]
    paths:
      - '.03_Harness Governance/**'
  workflow_dispatch:

# Read-only: this gate only reads and validates the repo.
permissions:
  contents: read

concurrency:
  group: hermes-gate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: '.03_Harness Governance'

jobs:
  schema-validate:
    name: Validate eval receipts
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install validator dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate every eval receipt against the schema
        run: |
          shopt -s nullglob
          receipts=(operations/receipts/*.eval_receipt.json)
          if [ ${#receipts[@]} -eq 0 ]; then
            echo "::notice::No eval receipts under operations/receipts/ — advisory pass (Phase 1/2)."
            exit 0
          fi
          rc=0
          for r in "${receipts[@]}"; do
            echo "--- validating $r ---"
            if ! python scripts/validate_packet.py "$r" schemas/eval_receipt.schema.json; then
              echo "::error::Eval receipt failed schema validation: $r"
              rc=1
            fi
          done
          exit $rc

  receipt-required:
    name: Mission PR includes a receipt
    # Framework Phase 3. PR-only: a post-merge push to Main has no PR diff to evaluate.
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Require an eval receipt for mission-file changes
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          # Explicit human override for non-mission infra PRs.
          if echo "$LABELS" | grep -q '"no-receipt"'; then
            echo "::notice::'no-receipt' label present — receipt requirement waived for this PR."
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          # --name-only paths are repo-root-relative regardless of working-directory.
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "Changed files in PR:"
          echo "$changed"
          scope='.03_Harness Governance/'
          receipts_re='^\.03_Harness Governance/operations/receipts/.*\.eval_receipt\.json$'
          substantive=0
          receipt=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              "$scope"*) ;;       # in scope
              *) continue ;;      # outside the Hermes harness tree — ignore
            esac
            if echo "$f" | grep -Eq "$receipts_re"; then
              receipt=1
            else
              substantive=1
            fi
          done <<< "$changed"
          if [ "$substantive" -eq 1 ] && [ "$receipt" -eq 0 ]; then
            echo "::error::This PR changes mission files under '.03_Harness Governance/' but adds no eval receipt. Commit a <mission_id>.eval_receipt.json under operations/receipts/, or apply the 'no-receipt' label for a non-mission infra change."
            exit 1
          fi
          echo "::notice::Receipt requirement satisfied (substantive=$substantive receipt=$receipt)."

  yaml-parse:
    name: Config YAML parses
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Parse Hermes config / routing YAML
        run: |
          python - <<'PY'
          import glob, sys
          import yaml

          bad = 0
          targets = sorted(
              set(glob.glob("config/*.yaml") + glob.glob("config/*.yml"))
          )
          if not targets:
              print("::notice::No config YAML found — nothing to parse.")
          for f in targets:
              try:
                  with open(f, encoding="utf-8") as fh:
                      list(yaml.safe_load_all(fh))
                  print(f"ok: {f}")
              except Exception as exc:  # noqa: BLE001
                  print(f"::error::YAML parse failed: {f}: {exc}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

  unit-tests:
    name: Harness governance tests
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      # -o addopts="" overrides pytest.ini's --cov flags so the gate stays scoped
      # and deterministic. Broaden this to the full scripts/tests suite once those
      # suites' dependencies are pinned in requirements-dev.txt.
      - name: Run eval-receipt contract tests
        run: python -m pytest scripts/tests/test_eval_receipt.py -o addopts="" -q
