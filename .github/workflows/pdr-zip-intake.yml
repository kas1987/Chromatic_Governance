name: PDR ZIP Intake

on:
  push:
    paths:
      - ".01_PDRs/*.zip"
      - ".01_PDRs/pdr_zip_intake.py"
      - ".01_PDRs/PDR_REGISTRY.json"
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Optional single ZIP filename (e.g. repo-pdr-swarm-router.zip)"
        required: false

permissions:
  contents: read

concurrency:
  group: pdr-zip-intake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intake-review:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Run ZIP intake scan
        working-directory: .01_PDRs
        # zip_name passed via env, never inlined into the shell.
        env:
          ZIP_NAME: ${{ github.event.inputs.zip_name }}
        run: |
          if [ -n "$ZIP_NAME" ]; then
            python pdr_zip_intake.py --zip-name "$ZIP_NAME"
          else
            python pdr_zip_intake.py
          fi

      - name: Upload intake artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdr-zip-intake-artifacts
          path: |
            .01_PDRs/.intake/zip_intake.db
            .01_PDRs/.intake/zip_intake-log.jsonl
