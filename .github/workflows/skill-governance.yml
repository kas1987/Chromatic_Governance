name: Skill Governance

on:
  pull_request:
    paths:
      - '.02_Plugins/**'
  push:
    branches:
      - Main
    paths:
      - '.02_Plugins/**'
  workflow_dispatch:

# Read-only validation jobs — no write scopes needed.
permissions:
  contents: read

concurrency:
  group: skill-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-scaffold:
    name: Plugin scaffold structure
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate plugin scaffold structure
        run: |
          cd .02_Plugins
          bash scripts/validate-scaffold.sh .

      - name: Validate plugin structure audit
        run: |
          cd .02_Plugins
          bash toolchain-family/scripts/plugin-structure-audit.sh .

  validate-skills:
    name: SKILL.md governance compliance
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate SKILL.md governance compliance
        run: python .github/scripts/validate_skills.py

  test-mcp-server:
    name: MCP skill server tests
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install MCP server dependencies
        run: pip install -r .02_Plugins/mcp/requirements.txt

      - name: Run MCP server tests
        run: python -m pytest .02_Plugins/mcp/tests/ -v --tb=short
