name: Skill Governance

on:
  pull_request:
    paths:
      - '.02_Plugins/**'
  push:
    branches:
      - Main
    paths:
      - '.02_Plugins/**'
  workflow_dispatch:

# Read-only validation jobs — no write scopes needed.
permissions:
  contents: read

concurrency:
  group: skill-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-scaffold:
    name: Plugin scaffold structure
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate plugin scaffold structure
        run: |
          cd .02_Plugins
          bash scripts/validate-scaffold.sh .

      - name: Validate plugin structure audit
        run: |
          cd .02_Plugins
          bash toolchain-family/scripts/plugin-structure-audit.sh .

  validate-skills:
    name: SKILL.md governance compliance
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate SKILL.md governance compliance
        run: python .github/scripts/validate_skills.py

  test-mcp-server:
    name: MCP skill server tests
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install MCP server dependencies
        run: pip install -r .02_Plugins/mcp/requirements.txt

      - name: Run MCP server tests
        run: python -m pytest .02_Plugins/mcp/tests/ -v --tb=short
